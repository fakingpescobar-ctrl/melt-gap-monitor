name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners ship with the Android SDK preinstalled (ANDROID_HOME).
      # We only need to accept the licenses so AGP can pull platform/build-tools on demand.
      - name: Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed | head -20 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (CV core)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: melt-gap-monitor-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build release APK (unsigned)
        run: ./gradlew --no-daemon assembleRelease
        continue-on-error: true

      - name: Publish APK to Releases
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest /tmp/app-debug.apk \
            --title "Latest debug build" \
            --notes "Auto-built from ${GITHUB_SHA}" \
            --prerelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        with:
          name: melt-gap-monitor-release-unsigned
          path: app/build/outputs/apk/release/*.apk
